<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html,body{margin:0;background:#e4e7eb;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Renders every view of /views.json ({environment, exposure, auto, views:[{name, az, el, dist, fit, target?}]}) from ONE
// load of /model.glb, POSTs each final frame (PNG) to /shot?cam=<name> and a manifest to /finished (src/core/workshop3d/render.ts).
// Camera rules live in /camera.js. A blank frame is re-framed and redrawn at most twice.
// Light: a studio (or outdoor) environment built in code and pre-filtered with PMREM (no network), a shadow-casting key
// light, real point lights at the emissive lamps, planar mirrors (metal, roughness <= 0.08, thin panels) as Reflectors.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { Reflector } from "three/addons/objects/Reflector.js";
import { frameView, classify, interiorPreset, retryFrames, INTERIOR_GROUPS, GROUP_LABEL, pixelStats, isBlank } from "/camera.js";

const W = 1280, H = 960;
const manifest = [];
const post = (url, body) => fetch(url, { method: "POST", body }).catch(() => {});

/** Studio: dark grey room with bright soft boxes (gives metals and mirrors something to reflect). Outdoor: sky + sun. */
function environmentScene(outdoor) {
  const s = new THREE.Scene();
  const basic = (rgb, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(rgb[0] * k, rgb[1] * k, rgb[2] * k), side: THREE.DoubleSide });
  const panel = (w, h, mat, pos, look) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(...pos);
    m.lookAt(...look);
    s.add(m);
  };
  if (outdoor) {
    s.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), basic([0.55, 0.7, 0.95], 1.6)));
    panel(80, 80, basic([0.32, 0.29, 0.24], 1), [0, -6, 0], [0, 0, 0]);
    panel(3, 3, basic([1, 0.95, 0.85], 60), [12, 18, 8], [0, 0, 0]);
    return s;
  }
  s.add(new THREE.Mesh(new THREE.BoxGeometry(20, 12, 20), basic([0.42, 0.43, 0.45], 1)));
  panel(20, 20, basic([0.2, 0.2, 0.21], 1), [0, -5.95, 0], [0, 0, 0]);
  panel(9, 7, basic([1, 1, 1], 7), [0, 5.9, 0], [0, 0, 0]);
  panel(1.6, 8, basic([1, 0.98, 0.95], 5), [-9.9, 1, -2], [0, 1, -2]);
  panel(1.6, 8, basic([0.95, 0.98, 1], 4), [9.9, 1, 3], [0, 1, 3]);
  panel(7, 3.5, basic([1, 0.93, 0.85], 2.5), [0, 1.5, 9.9], [0, 1.5, 0]);
  panel(5, 2.5, basic([0.9, 0.95, 1], 1.6), [2, 0.5, -9.9], [2, 0.5, 0]);
  return s;
}

try {
  const spec = await (await fetch("/views.json")).json();
  const outdoor = spec.environment === "outdoor";
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1);
  r.setSize(W, H);
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.shadowMap.enabled = true;
  r.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(r.domElement);
  const baseExposure = Math.min(Math.max(Number(spec.exposure) || 1, 0.4), 2.5);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(outdoor ? 0xbfd6ea : 0xe4e7eb);
  const pmrem = new THREE.PMREMGenerator(r);
  scene.environment = pmrem.fromScene(environmentScene(outdoor), 0).texture;

  const gltf = await new GLTFLoader().loadAsync("/model.glb");
  const model = gltf.scene;
  scene.add(model);
  model.updateMatrixWorld(true);
  const box3 = new THREE.Box3().setFromObject(model);
  const size = box3.getSize(new THREE.Vector3());
  const centre = box3.getCenter(new THREE.Vector3());
  const diag = size.length() || 1;
  const box = { min: { x: box3.min.x, y: box3.min.y, z: box3.min.z }, max: { x: box3.max.x, y: box3.max.y, z: box3.max.z } };
  const meshes = [];
  const maxAniso = r.capabilities.getMaxAnisotropy();
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    meshes.push(o);
    for (const k of ["map", "normalMap", "roughnessMap", "metalnessMap"]) if (o.material[k]) o.material[k].anisotropy = maxAniso;
  });

  // ---- hollow test: rays from the centre must hit inward-facing surfaces on (almost) every side
  const ray = new THREE.Raycaster();
  const saved = meshes.map((m) => m.material.side);
  meshes.forEach((m) => { m.material.side = THREE.DoubleSide; });
  const axes = [["x", 1], ["x", -1], ["y", 1], ["y", -1], ["z", 1], ["z", -1]];
  const free = {};
  let enclosed = 0;
  for (const [k, sgn] of axes) {
    const dir = new THREE.Vector3();
    dir[k] = sgn;
    const dists = [];
    for (const off of [[0, 0], [0.18, 0.12], [-0.18, -0.12]]) {
      const o = centre.clone();
      const others = ["x", "y", "z"].filter((a) => a !== k);
      o[others[0]] += off[0] * size[others[0]];
      o[others[1]] += off[1] * size[others[1]];
      ray.set(o, dir);
      ray.far = diag * 2;
      const hit = ray.intersectObjects(meshes, false).find((h) => h.face && h.face.normal.clone().transformDirection(h.object.matrixWorld).dot(dir) < 0);
      if (hit) dists.push(hit.point[k]);
    }
    if (dists.length >= 2) {
      enclosed++;
      free[k + (sgn > 0 ? "+" : "-")] = sgn > 0 ? Math.min(...dists) : Math.max(...dists);
    }
  }
  meshes.forEach((m, i) => { m.material.side = saved[i]; });
  let interior = null;
  if (enclosed >= 5) {
    const ib = {
      min: { x: free["x-"] ?? box.min.x, y: free["y-"] ?? box.min.y, z: free["z-"] ?? box.min.z },
      max: { x: free["x+"] ?? box.max.x, y: free["y+"] ?? box.max.y, z: free["z+"] ?? box.max.z },
    };
    const vol = (b) => Math.max(0, b.max.x - b.min.x) * Math.max(0, b.max.y - b.min.y) * Math.max(0, b.max.z - b.min.z);
    if (vol(ib) > 0.2 * vol(box) && Math.min(ib.max.x - ib.min.x, ib.max.z - ib.min.z) > 0.3) interior = ib;
  }

  // ---- lights
  const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8478, outdoor ? 0.6 : 0.35);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(outdoor ? 0xfff1d6 : 0xffffff, outdoor ? 2.6 : 2.0);
  key.position.set(centre.x + diag * 1.1, centre.y + diag * 1.8, centre.z + diag * 1.4);
  key.target.position.copy(centre);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, { left: -diag, right: diag, top: diag, bottom: -diag, near: 0.01, far: diag * 6 });
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.02;
  scene.add(key, key.target);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(diag * 8, diag * 8), new THREE.ShadowMaterial({ opacity: 0.22 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(centre.x, box.min.y - 0.002, centre.z);
  ground.receiveShadow = true;
  scene.add(ground);

  // emissive parts glow and really light the room
  const lamps = meshes.filter((m) => {
    const e = m.material.emissive;
    return e && 0.2126 * e.r + 0.7152 * e.g + 0.0722 * e.b > 0.05;
  });
  for (const m of lamps) m.material.emissiveIntensity = 2.5;
  const lampPoints = lamps.map((m) => new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()));
  if (lampPoints.length === 0 && interior) lampPoints.push(new THREE.Vector3((interior.min.x + interior.max.x) / 2, interior.max.y - 0.1, (interior.min.z + interior.max.z) / 2));
  const pick = lampPoints.length <= 8 ? lampPoints : Array.from({ length: 8 }, (_, i) => lampPoints[Math.floor((i * lampPoints.length) / 8)]);
  const lampLights = pick.map((p) => {
    const l = new THREE.PointLight(0xfff4e0, 4 / pick.length + 0.35, 0, 2);
    l.position.copy(p);
    if (interior) l.position.y = Math.min(p.y, interior.max.y) - 0.06;
    scene.add(l);
    return l;
  });

  // planar mirrors: real reflections of the model instead of a blurred environment
  let mirrors = 0;
  for (const m of meshes) {
    const mat = m.material;
    if (!(mat.metalness >= 0.9 && mat.roughness <= 0.08) || mat.map) continue;
    const b = new THREE.Box3().setFromObject(m);
    const s = b.getSize(new THREE.Vector3());
    const dims = [["x", s.x], ["y", s.y], ["z", s.z]].sort((a, c) => a[1] - c[1]);
    if (dims[0][1] > 0.05 * dims[1][1] || dims[1][1] * dims[2][1] < 0.04 || mirrors >= 3) continue;
    const k = dims[0][0];
    const c = b.getCenter(new THREE.Vector3());
    const n = new THREE.Vector3();
    n[k] = c[k] > centre[k] ? -1 : 1;
    const refl = new Reflector(new THREE.PlaneGeometry(1, 1), {
      clipBias: 0.003, textureWidth: 1024, textureHeight: 1024,
      color: new THREE.Color().copy(mat.color).multiplyScalar(0.85),
    });
    refl.position.copy(c).addScaledVector(n, s[k] / 2 + 0.002);
    refl.lookAt(refl.position.clone().add(n));
    const ax = new THREE.Vector3(1, 0, 0).applyQuaternion(refl.quaternion);
    const ay = new THREE.Vector3(0, 1, 0).applyQuaternion(refl.quaternion);
    const span = (a) => Math.abs(a.x) * s.x + Math.abs(a.y) * s.y + Math.abs(a.z) * s.z;
    refl.scale.set(span(ax), span(ay), 1);
    scene.add(refl);
    mirrors++;
  }

  // ---- drawing
  const cam = new THREE.PerspectiveCamera(40, W / H, 0.01, 100);
  const gl = r.getContext();
  const pixels = new Uint8Array(W * H * 4);
  function draw(f) {
    cam.fov = f.fov;
    cam.near = f.near;
    cam.far = f.far;
    cam.position.set(f.position.x, f.position.y, f.position.z);
    cam.up.set(0, 1, 0);
    cam.lookAt(f.lookAt.x, f.lookAt.y, f.lookAt.z);
    cam.updateProjectionMatrix();
    const inside = f.mode !== "exterior";
    scene.environmentIntensity = inside ? 0.5 : 1.0;
    r.toneMappingExposure = baseExposure * (inside ? 0.95 : 1.0);
    ground.visible = !inside;
    r.render(scene, cam);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    return pixelStats(pixels);
  }
  const blob = () => new Promise((res) => r.domElement.toBlob(res, "image/png"));
  async function shoot(name, first, retries, extra) {
    let f = first;
    let st = draw(f);
    let attempts = 1;
    for (const alt of retries) {
      if (!isBlank(st) || attempts >= 3) break;
      f = alt;
      st = draw(f);
      attempts++;
    }
    const group = extra.group ?? classify(f);
    await post("/shot?cam=" + encodeURIComponent(name), await blob());
    manifest.push({ name, group, label: GROUP_LABEL[group] ?? group, mode: f.mode, attempts, blank: isBlank(st), auto: !!extra.auto });
    return group;
  }
  const partBox = (id) => {
    const o = id ? model.getObjectByName(id) : null;
    return o ? new THREE.Box3().setFromObject(o) : null;
  };
  const covered = new Set();
  for (const v of spec.views) {
    try {
      const pb = partBox(v.target);
      const target = pb ? pb.getCenter(new THREE.Vector3()) : null;
      const o = { az: v.az, el: v.el, dist: v.dist, fit: !!v.fit, box, interior, target: target ? { x: target.x, y: target.y, z: target.z } : null };
      const f = frameView(o);
      covered.add(await shoot(v.name, f, retryFrames(o, f), {}));
    } catch (e) {
      console.error(e);
    }
  }
  if (spec.auto && interior) {
    let cop = null;
    for (const m of meshes) {
      if (!/(^|_)cop(_|$)|control_panel|bang_goi|bang_dieu_khien/.test(m.name)) continue;
      const b = new THREE.Box3().setFromObject(m);
      cop = cop ? cop.union(b) : b;
    }
    const copBox = cop ? { min: { x: cop.min.x, y: cop.min.y, z: cop.min.z }, max: { x: cop.max.x, y: cop.max.y, z: cop.max.z } } : null;
    for (const g of INTERIOR_GROUPS) {
      if (covered.has(g)) continue;
      const f = interiorPreset(g, box, interior, copBox);
      if (!f) continue;
      try {
        await shoot("auto_" + g, f, [], { group: g, auto: true });
      } catch (e) {
        console.error(e);
      }
    }
  }
  console.log("hollow", !!interior, "lamps", lampLights.length, "mirrors", mirrors);
} catch (err) {
  document.body.textContent = "ERR " + err;
  console.error(err);
}
await post("/finished", JSON.stringify(manifest));
document.title = "ready";
</script>
</body>
</html>
