<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNF Controller · mẫu một màn hình</title>
<style>
  :root {
    --bg: #0b1020; --panel: #111829; --panel-2: #172034; --ink: #e9eef8; --muted: #8b98b3; --line: #243049;
    --accent: #5aa0ff; --gold: #d9b26a; --ok: #2ed47a; --warn: #ffc542; --err: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; }
  .app { display: grid; grid-template-columns: 310px 1fr; height: 100vh; }
  .side { background: linear-gradient(180deg, #131c30, #0e1526); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .logo { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, #5aa0ff, #9cc4ff); display: grid; place-items: center; color: #fff; font-weight: 800; box-shadow: 0 6px 18px rgba(90,160,255,.35); }
  .brand { font-weight: 700; } .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .icon-btn { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .work { padding: 14px 16px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .work h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); display: flex; align-items: center; }
  .work h4 .mini { margin-left: auto; font-size: 11px; text-transform: none; letter-spacing: 0; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer; }
  .cmd { display: flex; gap: 8px; }
  .cmd input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #0b1020; color: var(--ink); }
  .btn { padding: 10px 14px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px rgba(90,160,255,.3); }
  .btn.ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: linear-gradient(180deg, #172034, #121a2c); }
  .run-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 13px; cursor: pointer; }
  .run-row:first-of-type { border-top: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: ping 1.6s infinite; flex: none; }
  .dot.idle { background: var(--muted); animation: none; } .dot.off { background: var(--warn); animation: none; }
  .steps { display: flex; gap: 4px; margin-top: 4px; margin-bottom: 4px; flex-wrap: wrap; }
  .step { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #0b1020; color: var(--muted); border: 1px solid var(--line); }
  .step.doing { background: rgba(90,160,255,.2); color: #b4d0ff; border-color: #5aa0ff; }
  .step.done { background: rgba(46,212,122,.15); color: #7ff0b0; border-color: #2ed47a; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .nav button { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer; font: inherit; font-weight: 600; }
  .note { font-size: 11px; color: var(--muted); padding: 0 16px 10px; }
  .fine { font-size: 11px; color: var(--muted); }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(46,212,122,.6);} 100% { box-shadow: 0 0 0 10px rgba(46,212,122,0);} }

  .scene { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(1200px 600px at 60% 10%, #1a2550 0%, #0b1020 55%, #070a14 100%); }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); top: 14px; z-index: 5; font-size: 12px; color: var(--muted); background: rgba(11,16,32,.6); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); backdrop-filter: blur(4px); pointer-events: none; }
  svg.city { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .lbl { font: 600 12px "Segoe UI", system-ui; fill: #e9eef8; } .sub { font: 10px "Segoe UI", system-ui; fill: #8b98b3; }
  svg * { transform-box: view-box; }
  .star, .ripple, .jet, .tree, .plant, .lamp-glow, .sheen, .steam, .bob, .tv, .mon, .window-lit, .win, .p .torso, .p .head, .p .eye, .p .pupil, .p .arm, .p .leg, .p .body, .p .brow, .p .mouth, .p .think, .p .zzz { transform-box: fill-box; }
  .star { animation: twinkle 3s ease-in-out infinite; transform-origin: center; }
  .beacon { animation: beacon 2s ease-in-out infinite; }
  .win { animation: winflick 11s ease-in-out infinite; }
  .ripple { animation: ripple 2.6s ease-out infinite; transform-origin: center; }
  .jet { animation: jet 1.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .tree { transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite alternate; }
  @keyframes walkR { from { transform: translateX(-120px);} to { transform: translateX(3400px);} } @keyframes walkL { from { transform: translateX(3400px);} to { transform: translateX(-120px);} }
  .car { animation: drive 18s linear infinite; } .car.back { animation: drive-back 22s linear infinite; } .wheel { animation: spin .7s linear infinite; transform-origin: center; }
  .car.stop { animation-name: driveStop; animation-timing-function: linear; } .car.stop .wheel { animation-name: spinStop; animation-duration: inherit; animation-delay: inherit; animation-timing-function: linear; }
  .car.stop .brake { animation-name: brake; animation-duration: inherit; animation-delay: inherit; animation-iteration-count: infinite; animation-timing-function: linear; } .bob { animation: carbob .55s ease-in-out infinite alternate; } .car .blink { animation: blink2 .8s steps(2) infinite; } .car .beam { animation: beamflick 3s ease-in-out infinite; }
  @keyframes driveStop { 0% { transform: translateX(-300px);} 34% { transform: translateX(var(--stop));} 46% { transform: translateX(var(--stop));} 100% { transform: translateX(1700px);} }
  @keyframes spinStop { 0% { transform: rotate(0);} 34% { transform: rotate(3600deg);} 46% { transform: rotate(3600deg);} 100% { transform: rotate(9000deg);} } @keyframes brake { 0%,30%,50%,100% { opacity: .35;} 32%,48% { opacity: 1;} }
  @keyframes carbob { from { transform: translateY(0);} to { transform: translateY(-.8px);} } @keyframes blink2 { from { opacity: 1;} to { opacity: .1;} } @keyframes beamflick { 0%,100% { opacity: .14;} 50% { opacity: .2;} }
  @keyframes drive { from { transform: translateX(-260px);} to { transform: translateX(1700px);} } @keyframes drive-back { from { transform: translateX(1700px);} to { transform: translateX(-260px);} } @keyframes spin { to { transform: rotate(360deg);} }
  .floor-band { cursor: pointer; transition: filter .2s; }
  .floor-band:hover .glass { filter: brightness(1.35); }
  .floor-band:hover .plate { fill: #243049; }
  .sheen { animation: sheen 9s ease-in-out infinite; }
  .neon { animation: neon 2.4s ease-in-out infinite alternate; }
  .cloud { animation: drift linear infinite; }
  @keyframes twinkle { 0%,100% { opacity: .3; transform: scale(.8);} 50% { opacity: 1; transform: scale(1.2);} }
  @keyframes beacon { 0%,100% { opacity: .2;} 50% { opacity: 1;} }
  @keyframes winflick { 0%,93%,100% { opacity: 1;} 96% { opacity: .35;} }
  @keyframes ripple { from { transform: scale(.3); opacity: .8;} to { transform: scale(1.7); opacity: 0;} }
  @keyframes jet { from { transform: scaleY(.7);} to { transform: scaleY(1.15);} }
  @keyframes sway { from { transform: rotate(-1.4deg);} to { transform: rotate(1.4deg);} }
  @keyframes sheen { 0% { transform: translateX(-120px); opacity: 0;} 25% { opacity: .35;} 60% { opacity: .35;} 100% { transform: translateX(380px); opacity: 0;} }
  @keyframes neon { from { opacity: .6; filter: drop-shadow(0 0 2px #ffb15c);} to { opacity: 1; filter: drop-shadow(0 0 10px #ffb15c);} }
  @keyframes drift { from { transform: translateX(-300px);} to { transform: translateX(1700px);} }

  /* nhân vật */
  .p .torso { animation: breathe 2.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .p .head { animation: headbob 2.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .p .eye { animation: blink 4.5s infinite; transform-origin: center; }
  .p .arm { transform-origin: 50% 0; } .p .leg { transform-origin: 50% 0; }
  .p.typing .arm { animation: type .22s ease-in-out infinite alternate; } .p.typing .arm.r { animation-delay: -.11s; }
  .p.walking .leg { animation: step .42s ease-in-out infinite alternate; } .p.walking .leg.r { animation-delay: -.42s; }
  .p.walking .arm { animation: swing .42s ease-in-out infinite alternate; } .p.walking .arm.l { animation-delay: -.42s; }
  .p.walking .torso { animation: lean .42s ease-in-out infinite alternate; }
  .p.talking .arm.r { animation: talk .6s ease-in-out infinite alternate; } .p.talking .head { animation: nodyes 1s ease-in-out infinite alternate; }
  .p.cooking .arm.r { animation: stir 1s ease-in-out infinite alternate; }
  .p.drinking .arm.r { transform: rotate(-150deg); }
  .p.resting .head { transform: rotate(-6deg); animation: none; }
  .p.stretch .arm { animation: stretch 1.4s ease-in-out infinite alternate; }
  .p.happy .torso { animation: hop .6s ease-in-out infinite alternate; } .p.happy .arm { animation: cheer .6s ease-in-out infinite alternate; }
  .p .mood { font: 600 9px "Segoe UI", system-ui; fill: #e9eef8; } .mood-bg { fill: rgba(233,238,248,.96); } .p .mood { fill: #0b1020; }
  .p .think { }
  @keyframes thinkpop { from { transform: scale(0); opacity: 0;} to { transform: scale(1); opacity: 1;} }
  .p.idle .head, .p.seated .head { animation: lookaround 7s ease-in-out infinite; } .p.idle .pupil { animation: glance 7s ease-in-out infinite; }
  .p.seated .arm { transform: rotate(-60deg); }
  .p.idle .body { animation: weight 3.2s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .p.phone .arm.r { transform: rotate(-120deg); } .p.phone .head { transform: rotate(8deg) translateY(2px); animation: none; }
  .p.resting .arm { transform: rotate(-20deg); } .p.resting .pupil { transform: translateY(.6px); }
  .p.sleeping .eye, .p.sleeping .pupil { transform: scaleY(.12); animation: none; } .p.sleeping .mouth { opacity: .6; }
  .p.sleeping .torso { animation: breathe 4s ease-in-out infinite alternate; }
  .p.typing .pupil { animation: scan 1.6s ease-in-out infinite alternate; }
  .p.talking .brow { animation: browup 1s ease-in-out infinite alternate; }
  .p.happy .eye { transform: scaleY(.55); } .p.stretch .head { animation: nodyes 1.4s ease-in-out infinite alternate; }
  .p.walking .head { animation: bobwalk .42s ease-in-out infinite alternate; }
  @keyframes lookaround { 0%,35%,100% { transform: rotate(0);} 45%,60% { transform: rotate(-5deg);} 70%,85% { transform: rotate(4deg);} }
  @keyframes glance { 0%,35%,100% { transform: translateX(0);} 45%,60% { transform: translateX(-1.4px);} 70%,85% { transform: translateX(1.2px);} }
  @keyframes weight { from { transform: translateX(0) rotate(0);} to { transform: translateX(.8px) rotate(.8deg);} }
  @keyframes scan { from { transform: translateX(-.8px);} to { transform: translateX(.8px);} }
  @keyframes browup { from { transform: translateY(0);} to { transform: translateY(-1.2px);} }
  @keyframes bobwalk { from { transform: translateY(0);} to { transform: translateY(-1.6px) rotate(1.5deg);} }
  .mon { animation: mon 2.4s ease-in-out infinite; } .tv { animation: tv 1.1s steps(2) infinite; } .steam { animation: steam 2.2s ease-out infinite; }
  @keyframes breathe { from { transform: scaleY(1);} to { transform: scaleY(1.03);} }
  @keyframes headbob { from { transform: translateY(0);} to { transform: translateY(-1.2px);} }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1);} 95% { transform: scaleY(.08);} }
  @keyframes type { from { transform: rotate(-70deg);} to { transform: rotate(-82deg);} }
  @keyframes step { from { transform: rotate(-26deg);} to { transform: rotate(26deg);} }
  @keyframes swing { from { transform: rotate(22deg);} to { transform: rotate(-22deg);} }
  @keyframes lean { from { transform: rotate(2deg);} to { transform: rotate(-2deg) translateY(-1.5px);} }
  @keyframes talk { from { transform: rotate(-40deg);} to { transform: rotate(-70deg);} }
  @keyframes nodyes { from { transform: rotate(-3deg);} to { transform: rotate(4deg) translateY(1px);} }
  @keyframes stir { from { transform: rotate(-60deg);} to { transform: rotate(-95deg);} }
  @keyframes stretch { from { transform: rotate(160deg);} to { transform: rotate(185deg);} }
  @keyframes hop { from { transform: translateY(0);} to { transform: translateY(-4px);} }
  @keyframes cheer { from { transform: rotate(150deg);} to { transform: rotate(175deg);} }
  @keyframes mon { 0%,100% { opacity: .6;} 50% { opacity: 1;} }
  @keyframes tv { from { opacity: .5;} to { opacity: .9;} }
  @keyframes steam { 0% { transform: translateY(0) scale(.6); opacity: .6;} 100% { transform: translateY(-16px) scale(1.2); opacity: 0;} }

  /* popup */
  .overlay { position: fixed; inset: 0; background: rgba(4,7,16,.6); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 50; padding: 16px; }
  .overlay.open { display: grid; }
  .modal { width: min(900px, 100%); max-height: 92vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: in .18s ease-out; }
  @keyframes in { from { transform: translateY(12px) scale(.98); opacity: 0;} to { transform: none; opacity: 1;} }
  .modal header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .modal header h3 { margin: 0; font-size: 15px; } .modal header .fine { margin-left: 6px; }
  .modal .body { padding: 14px 18px; }
  .office { width: 100%; aspect-ratio: 900 / 560; background: radial-gradient(600px 300px at 50% 20%, #1a2342, #0b1020); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
  .office svg { width: 100%; height: 100%; display: block; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); } th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #243049; }
  textarea, select, input.f { background: #0b1020; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: inherit; padding: 6px 8px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 42vh; }
    .work { padding: 10px 16px; gap: 8px; }
    .nav { grid-template-columns: repeat(4, 1fr); padding: 8px 16px; } .nav button { padding: 8px 4px; font-size: 12px; }
    .note { display: none; } .hint { font-size: 11px; top: 8px; white-space: nowrap; }
    .modal .body { padding: 10px; } .office { aspect-ratio: 900 / 620; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <div class="logo">T</div>
      <div class="brand">TNF Controller<small>bản mẫu · dữ liệu giả</small></div>
      <button class="icon-btn" title="Cài đặt" data-open="settings">⚙</button>
    </div>
    <div class="work">
      <div>
        <h4>Cửa sổ làm việc</h4>
        <div class="cmd"><input placeholder="Ra lệnh bằng một câu tiếng Việt…"><button class="btn" data-open="command">Gửi</button></div>
      </div>
      <div class="card">
        <h4>TNF Tower · môi trường <button class="mini" id="add-env">＋ Thêm tầng</button></h4>
        <div id="s-envs"></div>
      </div>
      <div class="card">
        <h4>Thông báo</h4>
        <div id="s-log" class="fine" style="display:flex;flex-direction:column;gap:3px"></div>
      </div>
    </div>
    <nav class="nav">
      <button data-open="runs">Run</button><button data-open="history">Lịch sử</button><button data-open="library">Thư viện</button><button data-open="settings">Cài đặt</button>
    </nav>
    <div class="note">Chi phí hiển thị là ước tính, không phải hóa đơn.</div>
  </aside>

  <main class="scene">
    <div class="hint">Bấm vào một tầng để xem văn phòng bên trong</div>
    <svg class="city" viewBox="0 0 1400 846" preserveAspectRatio="xMidYMax meet" aria-label="Khu tháp TNF ban đêm">
      <defs>
        <linearGradient id="gGlass" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1d3a6b"/><stop offset=".5" stop-color="#15294d"/><stop offset="1" stop-color="#0f1d3a"/></linearGradient>
        <linearGradient id="gGlassDim" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1a2440"/><stop offset="1" stop-color="#0d1326"/></linearGradient>
        <linearGradient id="gSideT" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0c1630"/><stop offset="1" stop-color="#060b1a"/></linearGradient>
        <linearGradient id="gGold" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#b8924a"/><stop offset=".5" stop-color="#f0d58f"/><stop offset="1" stop-color="#b8924a"/></linearGradient>
        <linearGradient id="gGround" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#121a30"/><stop offset="1" stop-color="#05080f"/></linearGradient>
        <linearGradient id="gFade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="gSheen" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <radialGradient id="gLampU"><stop offset="0" stop-color="#d9b26a" stop-opacity=".55"/><stop offset="1" stop-color="#d9b26a" stop-opacity="0"/></radialGradient>
        <linearGradient id="gCarShade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient><radialGradient id="gLeaf" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#4fbf7f"/><stop offset=".55" stop-color="#2a7a52"/><stop offset="1" stop-color="#143826"/></radialGradient><radialGradient id="gLeaf2" cx=".4" cy=".25" r=".8"><stop offset="0" stop-color="#3a9a68"/><stop offset="1" stop-color="#102e1f"/></radialGradient><linearGradient id="gUp" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#ffd9a3" stop-opacity=".35"/><stop offset="1" stop-color="#ffd9a3" stop-opacity="0"/></linearGradient><radialGradient id="gWater"><stop offset="0" stop-color="#6fb7ff"/><stop offset="1" stop-color="#1f4f8f"/></radialGradient>
        <radialGradient id="gMoon"><stop offset="0" stop-color="#fff5d6"/><stop offset=".55" stop-color="#f3e3b5"/><stop offset="1" stop-color="#f3e3b5" stop-opacity="0"/></radialGradient>
        <mask id="mReflect"><rect x="0" y="560" width="1400" height="240" fill="url(#gFade)"/></mask>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
        <filter id="glowG" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <g id="stars"></g>
      <circle cx="1180" cy="120" r="70" fill="url(#gMoon)" opacity=".5"/><circle cx="1180" cy="120" r="26" fill="#fff5d6"/>
      <g class="cloud" style="animation-duration:160s"><ellipse cx="0" cy="150" rx="160" ry="10" fill="#fff" opacity=".05"/></g>
      <g id="skyline"></g>
      <!-- mặt đất bóng + phản chiếu -->
      <rect x="-3000" y="560" width="7200" height="3000" fill="url(#gGround)"/>
      <g id="reflect" mask="url(#mReflect)" opacity="0"></g>
      <!-- quảng trường -->
      <g id="plaza"></g>
      <!-- hai tòa tháp -->
      <g id="towers"></g>
      <!-- tiền cảnh: cây phố, đèn, xe, người (vẽ sau tháp) -->
      <g id="fg"></g>
    </svg>
  </main>
</div>

<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><header><h3 id="m-title">…</h3><span class="fine" id="m-sub"></span><button class="icon-btn" id="m-close" title="Đóng (Esc)" style="margin-left:auto">✕</button></header><div class="body" id="m-body"></div></div></div>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, children = []) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); for (const c of children) n.appendChild(c); return n; };
  const txt = (x, y, s, cls, extra = {}) => { const t = el('text', { x, y, class: cls || '', 'text-anchor': 'middle', ...extra }); t.textContent = s; return t; };

  const STATUS = { free: '#8b98b3', doing: '#5aa0ff', done: '#2ed47a', off: '#ffc542' };

    const ev = e.target.closest('[data-env]'); if (ev) return openOffice(envs.find((x) => x.id === ev.dataset.env));
    if (e.target.closest('[data-add]')) return openView('add');
    if (e.target.closest('[data-acme]')) return openView('acme');
    if (e.target.id === 'm-add') { document.getElementById('add-env').click(); return close(); }
    if (e.target.closest('[data-close]') || e.target === ov || e.target.id === 'm-close') close();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  const city = document.querySelector('svg.city');
  function fit() { city.setAttribute('viewBox', window.innerWidth < 760 ? '200 150 900 696' : '0 0 1400 846'); }
  fit(); window.addEventListener('resize', fit);
</script>
</body>
</html>
